[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nile-gate"
version = "0.1.0"
description = "A safety-oriented multi-agent mission planning and coordination sandbox for Nile Galactic."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
nile-gate = "nile_gate.cli:main"

[tool.setuptools.packages.find]
include = ["nile_gate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
